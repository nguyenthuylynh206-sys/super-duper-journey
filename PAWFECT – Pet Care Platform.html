<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PAWFECT – Pet Care Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8EE;--cd:#fff;--ink:#24332B;--mu:#5E6E64;--g:#8CC5A2;--gd:#2F6B4F;--y:#F8EBB0;--ln:#E8E4D0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141D18;--cd:#1E2B24;--ink:#EEF4EF;--mu:#A9B9AF;--g:#4E8F6E;--gd:#A9DDBF;--y:#4A4420;--ln:#2E3E35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141D18;--cd:#1E2B24;--ink:#EEF4EF;--mu:#A9B9AF;--g:#4E8F6E;--gd:#A9DDBF;--y:#4A4420;--ln:#2E3E35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Nunito,ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}h1{font-size:clamp(2rem,6vw,3.3rem)}h2{font-size:1.6rem}h3{font-size:1.1rem}
.w{max-width:1080px;margin:auto;padding:0 16px}section{padding:24px 0}.mu{color:var(--mu)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g1{flex:1}.r{margin-left:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:10px;height:60px}.logo{font-weight:800;font-size:1.35rem;color:var(--gd)}
nav{display:flex;gap:2px;margin-left:auto;align-items:center}nav a,nav .l{padding:8px 10px;border-radius:12px;font-weight:600;font-size:.9rem;background:none;border:0;color:inherit;cursor:pointer;font-family:inherit}nav a:hover,nav .l:hover{background:var(--y)}
#mb{display:none;margin-left:auto;background:none;border:1px solid var(--ln);border-radius:12px;padding:5px 12px;font-size:1.2rem;color:inherit}
@media(max-width:900px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:60px;background:var(--bg);flex-direction:column;align-items:stretch;padding:10px 16px;border-bottom:1px solid var(--ln)}nav.on{display:flex}}
.btn{display:inline-block;background:var(--gd);color:var(--bg);border:2px solid var(--gd);padding:11px 20px;border-radius:999px;font:inherit;font-weight:800;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.o{background:none;color:var(--gd);border-color:var(--g)}.btn.s{padding:6px 14px;font-size:.88rem}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;transition:.2s}.card:hover{box-shadow:0 8px 24px #0001}.pick{cursor:pointer}.sel{outline:3px solid var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.em{width:54px;height:54px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:1.7rem;flex:none}
.badge{display:inline-block;background:var(--y);padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:700}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;padding:30px 16px}.art{font-size:7rem;text-align:center;background:var(--y);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
@media(max-width:700px){.hero{grid-template-columns:1fr}.art{font-size:4.5rem;max-width:240px;margin:auto}}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:inherit;font:inherit;margin:4px 0 10px}label{font-weight:600;font-size:.9rem}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}.fl input,.fl select{margin:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.dots span{padding:4px 12px;border-radius:999px;border:1px solid var(--ln);font-size:.82rem}.dots .on{background:var(--g);color:var(--ink);border-color:var(--g)}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
details{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;margin:8px 0}summary{font-weight:700;cursor:pointer}
footer{background:var(--y);margin-top:30px;padding:26px 0;font-size:.92rem}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--gd);color:var(--bg);padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:40;font-weight:700}#t.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header><div class="w hd"><a class="logo" href="#home">🐾 PAWFECT</a><button id="mb" onclick="document.querySelector('nav').classList.toggle('on')">☰</button><div id="h" style="display:contents"></div></div></header>
<main id="app"></main>
<footer><div class="w"><b>🐾 PAWFECT</b> – Professional Care – Complete Peace of Mind.<br>Chăm sóc chuẩn mực – an tâm trọn vẹn.<p>✉️ hello@pawfect.vn · 📞 1900 0000 · <a href="#contact">Facebook</a> · <a href="#contact">Instagram</a> · <a href="#contact">TikTok</a></p><p class="mu">Bản demo: dữ liệu, thanh toán và eKYC chỉ mang tính mô phỏng. <a href="#admin">Quản trị</a></p></div></footer>
<div id="t"></div>
<script>
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString("vi-VN")+"đ",E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SV=[[1,"Pet Sitting","🏠","Chăm sóc thú cưng tại nhà bạn: cho ăn, vui chơi, dọn dẹp và gửi ảnh cập nhật.",250000,"3 giờ",3],[2,"Dog Walking","🦮","Dắt chó đi dạo, vận động an toàn theo thể trạng từng bé.",120000,"1 giờ",1],[3,"Pet Feeding","🥣","Cho ăn đúng khẩu phần, thay nước, vệ sinh khay ăn.",80000,"30 phút",.5],[4,"Pet Grooming","🛁","Tắm rửa, cắt tỉa lông, vệ sinh tai/móng ngay tại nhà.",300000,"2 giờ",2],[5,"Pet Boarding","🛏️","Trông giữ thú cưng theo ngày trong không gian sạch sẽ, an toàn.",200000,"1 ngày",6],[6,"Basic Pet Care","🩺","Chải lông, kiểm tra sức khỏe cơ bản, ghi nhật ký chăm sóc.",150000,"1 giờ",1]].map(a=>({id:a[0],n:a[1],e:a[2],d:a[3],p:a[4],t:a[5],h:a[6]}));
const CG=[[1,"Minh Anh","👩","Quận 1",3,"Tắm spa, cắt tỉa lông",4.9,212,180000,["Chó","Mèo"],[1,4,6]],[2,"Quốc Huy","👨","Thủ Đức",2,"Dắt dạo, huấn luyện cơ bản",4.8,164,100000,["Chó"],[2,3,5]],[3,"Thảo Nhi","👩‍🦱","Quận 7",4,"Chăm mèo, vệ sinh tai/móng",5,301,200000,["Mèo"],[1,3,4,6]],[4,"Gia Bảo","🧑","Bình Thạnh",1,"Cho ăn, trông giữ",4.6,58,90000,["Chó","Mèo"],[2,3,5]],[5,"Ngọc Hân","👩‍⚕️","Quận 3",5,"Sơ cứu thú cưng, chăm sóc cơ bản",4.9,340,220000,["Chó","Mèo","Thú nhỏ"],[1,4,5,6]],[6,"Đức Long","🧔","Gò Vấp",2,"Dắt dạo, trông giữ",4.7,97,110000,["Chó"],[1,2,5]]].map(a=>({id:a[0],n:a[1],e:a[2],a:a[3],x:a[4],k:a[5],r:a[6],j:a[7],p:a[8],pt:a[9],s:a[10]}));
const PC=["Thức ăn","Đồ chơi","Phụ kiện","Vệ sinh","Giường & chuồng","Sức khỏe"];
const PR=[[1,"Hạt cho chó trưởng thành 2kg","Thức ăn",189000,"🦴","Dinh dưỡng cân bằng, dễ tiêu hóa.",4.8],[2,"Pate cho mèo vị cá hồi","Thức ăn",32000,"🐟","Thơm ngon, giàu omega-3.",4.7],[3,"Bóng cao su nhai","Đồ chơi",59000,"🎾","Bền, an toàn cho răng.",4.6],[4,"Cần câu lông vũ cho mèo","Đồ chơi",45000,"🪶","Kích thích bản năng săn mồi.",4.5],[5,"Dây dắt phản quang","Phụ kiện",99000,"🦮","Nhẹ, êm tay, an toàn ban đêm.",4.7],[6,"Sữa tắm dịu nhẹ 300ml","Vệ sinh",120000,"🧴","Làm sạch, mềm lông, không cay mắt.",4.9],[7,"Giường tròn êm ái","Giường & chuồng",259000,"🛌","Vải mềm, giặt máy được.",4.8],[8,"Vitamin tổng hợp","Sức khỏe",150000,"💊","Hỗ trợ đề kháng cho chó mèo.",4.6]].map(a=>({id:a[0],n:a[1],c:a[2],p:a[3],e:a[4],d:a[5],r:a[6]}));
const ST=["Chờ xác nhận","Đã xác nhận","Đang chăm sóc","Hoàn thành","Đã hủy"];
let S={users:[],me:null,cart:{},orders:[],rev:[],msg:[],ver:{4:0}},F={},C={n:"",ph:"",ad:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("pf")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("pf",JSON.stringify(S))}catch(e){}};
const toast=t=>{const e=$("#t");e.textContent=t;e.className="on";setTimeout(()=>e.className="",2200)};
const newB=()=>({step:1,sv:0,cg:0,n:"",sp:"Chó",br:"",ag:"",nt:"",d:"",t:"09:00",ad:"",pay:"MoMo (mô phỏng)",done:""});let B=newB();
const sv=i=>SV.find(s=>s.id==i),cg=i=>CG.find(c=>c.id==i),ok=c=>S.ver[c.id]!==0,pr=i=>PR.find(p=>p.id==i);
const go=h=>{if(location.hash=="#"+h)render();else location.hash=h};
const setF=(k,v)=>{F[k]=v;render()};
const sel=(k,o)=>`<select onchange="setF('${k}',this.value)">${o.map(([v,l])=>`<option value="${v}"${(F[k]||"")==v?" selected":""}>${l}</option>`).join("")}</select>`;
const need=()=>{if(S.me)return 0;toast("Vui lòng đăng nhập (demo)");go("login");return 1};
const lb=o=>o.k=="shop"&&o.s==2?"Đang giao":ST[o.s];
const svCard=s=>`<div class="card"><div class="em">${s.e}</div><h3>${s.n}</h3><p class="mu">${s.d}</p><p><b>${f(s.p)}</b> · ${s.t}</p><button class="btn s" onclick="bk(${s.id})">Đặt ngay</button></div>`;
const cgCard=c=>`<div class="card"><div class="row"><div class="em">${c.e}</div><div><h3>${c.n}</h3><span class="mu">📍 ${c.a} · ${c.x} năm kinh nghiệm</span></div></div><p>${c.k}</p><p class="mu">⭐ ${c.r} · ${c.j} lượt · ${c.pt.join(", ")}</p><p>${ok(c)?'<span class="badge">✅ Đã xác minh</span>':'<span class="badge">⏳ Chờ xác minh</span>'} <b>${f(c.p)}/giờ</b></p><div class="row"><a class="btn o s" href="#cg-${c.id}">Xem hồ sơ</a><button class="btn s" onclick="bk(0,${c.id})">Đặt lịch</button></div></div>`;
const prCard=p=>`<div class="card"><div class="em">${p.e}</div><h3>${p.n}</h3><p class="mu">${p.d}</p><p>⭐ ${p.r} · <b>${f(p.p)}</b></p><button class="btn s" onclick="add(${p.id})">Thêm vào giỏ</button></div>`;
function bk(s,c){B=Object.assign(newB(),{sv:s||0,cg:c||0,step:s?2:1});go("booking")}
function add(i){S.cart[i]=(S.cart[i]||0)+1;save();toast("Đã thêm vào giỏ hàng 🛒");render()}
function qt(i,d){S.cart[i]+=d;if(S.cart[i]<=0)delete S.cart[i];save();render()}
function hdr(){const n=Object.values(S.cart).reduce((a,b)=>a+b,0);return`<nav>${[["home","Trang chủ"],["services","Dịch vụ"],["shop","Cửa hàng"],["caregivers","Đội ngũ chăm sóc"],["about","Giới thiệu"],["contact","Liên hệ"]].map(([h,l])=>`<a href="#${h}">${l}</a>`).join("")}<a href="#cart">🛒 ${n}</a>${S.me?`<a href="#orders">📦 Đơn</a><button class="l" onclick="S.me=null;save();go('home')">Thoát (${E(S.me.name)})</button>`:'<a href="#login">Đăng nhập / Đăng ký</a>'}<a class="btn s" href="#booking" onclick="B=newB()">Đặt dịch vụ ngay</a></nav>`}
function home(){return`<div class="w hero"><div><span class="badge">🐾 Pet Care Platform</span><h1>Your Pet Deserves The Best Care!</h1><p class="mu">PAWFECT giúp bạn tìm kiếm người chăm sóc thú cưng đáng tin cậy, đặt lịch nhanh chóng và an tâm tận hưởng cuộc sống dù bận rộn.</p><div class="row"><a class="btn" href="#services">Khám phá dịch vụ</a><a class="btn o" href="#caregivers">Tìm người chăm sóc</a></div></div><div class="art">🐶🐱</div></div>
<div class="w"><section><h2>Về PAWFECT</h2><p class="mu">Nền tảng kết nối chủ nuôi với caregiver đã được xác minh danh tính: tiện lợi, an toàn, minh bạch, có nhật ký ảnh/video sau mỗi buổi chăm sóc.</p></section>
<section><h2>Dịch vụ nổi bật</h2><div class="grid">${SV.slice(0,3).map(svCard).join("")}</div></section>
<section><h2>Quy trình đặt dịch vụ</h2><div class="grid">${["Chọn dịch vụ","Chọn caregiver","Điền thông tin bé","Xác nhận và theo dõi"].map((t,i)=>`<div class="card row"><div class="em">${i+1}</div><b>${t}</b></div>`).join("")}</div></section>
<section><h2>Người chăm sóc được xác minh</h2><div class="grid">${CG.filter(ok).slice(0,3).map(cgCard).join("")}</div></section>
<section><h2>Sản phẩm bán chạy</h2><div class="grid">${PR.slice(0,4).map(prCard).join("")}</div></section>
<section><h2>Khách hàng nói gì</h2><div class="grid">${[["Lan, sinh viên","Lịch học thất thường nhưng bé mèo vẫn được chăm đúng giờ, có ảnh gửi liền!"],["Tuấn, nhân viên văn phòng","Tăng ca đến khuya, caregiver dắt chó giúp mình rất chu đáo."],["Vy, chủ bé Mochi","Tắm spa tại nhà tiện, bé không bị stress như ở tiệm."]].map(([a,b])=>`<div class="card"><p>⭐⭐⭐⭐⭐</p><p>“${b}”</p><b>${a}</b></div>`).join("")}</div></section>
<section><div class="grid">${[["1.200+","lượt chăm sóc"],["150+","caregiver xác minh"],["4.8/5","điểm đánh giá"],["24/7","hỗ trợ"]].map(([a,b])=>`<div class="card"><h2>${a}</h2><span class="mu">${b}</span></div>`).join("")}</div><p class="mu">Số liệu minh họa cho bản demo.</p></section>
<section><h2>Câu hỏi thường gặp</h2>${[["Caregiver có được xác minh không?","Có. Mỗi caregiver trải qua bước xác minh danh tính (eKYC) trước khi nhận việc."],["Tôi theo dõi bé bằng cách nào?","Vào mục Đơn hàng để xem tiến trình, ảnh/video và đánh giá."],["Có thể hủy lịch không?","Bạn có thể hủy khi đơn chưa được caregiver bắt đầu chăm sóc."],["Mua sản phẩm thì ai giao hàng?","Đối tác lưu kho và giao hàng, PAWFECT kết nối và nhận hoa hồng."]].map(([q,a])=>`<details><summary>${q}</summary><p class="mu">${a}</p></details>`).join("")}</section>
<section class="card row"><h2 class="g1">Sẵn sàng để bé được chăm sóc tốt nhất?</h2><a class="btn" href="#booking" onclick="B=newB()">Đặt dịch vụ ngay</a></section></div>`}
function svPg(){const p=+F.p||0,L=SV.filter(s=>(!F.s||s.id==F.s)&&(!p||(p==1?s.p<100000:p==2?s.p>=100000&&s.p<=200000:s.p>200000)));return`<div class="w"><h2>Dịch vụ</h2><div class="fl">${sel("s",[["","Tất cả dịch vụ"],...SV.map(s=>[s.id,s.n])])}${sel("p",[["","Mọi mức giá"],[1,"Dưới 100.000đ"],[2,"100.000đ – 200.000đ"],[3,"Trên 200.000đ"]])}</div><div class="grid">${L.map(svCard).join("")||"<p>Không có dịch vụ phù hợp.</p>"}</div></div>`}
function cgPg(){const L=CG.filter(c=>(!F.a||c.a==F.a)&&(!F.t||c.pt.includes(F.t))&&(!F.s||c.s.includes(+F.s))&&(!F.m||c.p<=+F.m)&&(!F.r||c.r>=+F.r));return`<div class="w"><h2>Tìm người chăm sóc</h2><div class="fl">${sel("a",[["","Mọi khu vực"],...[...new Set(CG.map(c=>c.a))].map(a=>[a,a])])}${sel("t",[["","Mọi loại thú cưng"],["Chó","Chó"],["Mèo","Mèo"],["Thú nhỏ","Thú nhỏ"]])}${sel("s",[["","Mọi dịch vụ"],...SV.map(s=>[s.id,s.n])])}${sel("m",[["","Mọi mức giá"],[100000,"Đến 100.000đ/giờ"],[150000,"Đến 150.000đ/giờ"],[250000,"Đến 250.000đ/giờ"]])}${sel("r",[["","Mọi đánh giá"],[4.5,"Từ 4.5 ⭐"],[4.8,"Từ 4.8 ⭐"]])}</div><div class="grid">${L.map(cgCard).join("")||"<p>Không tìm thấy caregiver phù hợp.</p>"}</div></div>`}
function prof(i){const c=cg(i);if(!c)return home();const R=S.rev.filter(r=>r.cg==c.n);return`<div class="w"><section class="card"><div class="row"><div class="em">${c.e}</div><div><h2>${c.n}</h2><span class="mu">📍 ${c.a}</span></div></div><p>${ok(c)?"✅ Đã xác minh danh tính":"⏳ Đang chờ xác minh"} · ${c.x} năm kinh nghiệm · ⭐ ${c.r} · ${c.j} lượt</p><p><b>Kỹ năng:</b> ${c.k}</p><p><b>Dịch vụ:</b> ${c.s.map(s=>sv(s).n).join(", ")}</p><p><b>Giá:</b> ${f(c.p)}/giờ</p><div class="row"><button class="btn" onclick="bk(0,${c.id})">Đặt lịch</button><a class="btn o" href="#caregivers">Quay lại</a></div></section>${R.length?`<h3>Đánh giá gần đây</h3>${R.map(r=>`<div class="card">${"⭐".repeat(r.st)} ${E(r.tx)}</div>`).join("")}`:""}</div>`}
const cost=()=>{const a=cg(B.cg).p*sv(B.sv).h;return[a,a*.1,a*1.1]};
function bkPg(){if(B.done)return`<div class="w"><section class="card"><h2>🎉 Đặt lịch thành công!</h2><p>Mã đặt lịch: <b>${B.done}</b></p><a class="btn" href="#orders">Theo dõi đơn</a></section></div>`;const st=B.step;let h=`<div class="w"><h2>Đặt lịch dịch vụ</h2><div class="dots">${["Dịch vụ","Caregiver","Thú cưng","Thời gian","Chi phí","Xác nhận"].map((l,i)=>`<span class="${i+1==st?"on":""}">${i+1}. ${l}</span>`).join("")}</div><div class="card">`;
if(st==1)h+=`<div class="grid">${SV.map(s=>`<div class="card pick${B.sv==s.id?" sel":""}" onclick="B.sv=${s.id};render()"><b>${s.e} ${s.n}</b><br><span class="mu">${f(s.p)} · ${s.t}</span></div>`).join("")}</div>`;
if(st==2)h+=`<div class="grid">${CG.filter(c=>ok(c)&&c.s.includes(+B.sv)).map(c=>`<div class="card pick${B.cg==c.id?" sel":""}" onclick="B.cg=${c.id};render()"><b>${c.e} ${c.n}</b><br><span class="mu">📍 ${c.a} · ⭐ ${c.r} · ${f(c.p)}/giờ</span></div>`).join("")}</div>`;
if(st==3)h+=`<label>Tên thú cưng</label><input value="${E(B.n)}" oninput="B.n=this.value"><label>Loài</label><select onchange="B.sp=this.value">${["Chó","Mèo","Khác"].map(x=>`<option${B.sp==x?" selected":""}>${x}</option>`).join("")}</select><label>Giống</label><input value="${E(B.br)}" oninput="B.br=this.value"><label>Tuổi</label><input value="${E(B.ag)}" oninput="B.ag=this.value"><label>Tình trạng và lưu ý chăm sóc</label><textarea rows="3" oninput="B.nt=this.value">${E(B.nt)}</textarea>`;
if(st==4)h+=`<label>Ngày</label><input type="date" value="${B.d}" onchange="B.d=this.value"><label>Giờ</label><select onchange="B.t=this.value">${["08:00","09:00","10:00","14:00","16:00","18:00"].map(x=>`<option${B.t==x?" selected":""}>${x}</option>`).join("")}</select><label>Địa chỉ (TPHCM)</label><input value="${E(B.ad)}" oninput="B.ad=this.value">`;
if(st>=5){const[a,fe,t]=cost();h+=`<p><b>${sv(B.sv).n}</b> với <b>${cg(B.cg).n}</b> cho bé ${E(B.n)}<br>🗓 ${B.d} ${B.t} · ${E(B.ad)}</p><p>Phí caregiver: ${f(a)}<br>Phí nền tảng 10%: ${f(fe)}<br><b>Tổng dự kiến: ${f(t)}</b></p>`;if(st==6)h+=`<label>Thanh toán (mô phỏng, không phát sinh giao dịch thật)</label><select onchange="B.pay=this.value">${["MoMo (mô phỏng)","Chuyển khoản (mô phỏng)","Tiền mặt"].map(x=>`<option${B.pay==x?" selected":""}>${x}</option>`).join("")}</select>`}
return h+`</div><div class="row" style="margin-top:12px">${st>1?'<button class="btn o" onclick="B.step--;render()">← Quay lại</button>':""}<button class="btn" onclick="nx()">${st==6?"Xác nhận đặt lịch":"Tiếp tục →"}</button></div></div>`}
function nx(){const st=B.step,m=["Hãy chọn dịch vụ","Hãy chọn caregiver","Hãy nhập tên thú cưng","Hãy chọn ngày và nhập địa chỉ"];
if(st==1&&B.sv&&B.cg&&!cg(B.cg).s.includes(+B.sv))B.cg=0;
const bad=st==1?!B.sv:st==2?!B.cg:st==3?!B.n.trim():st==4?(!B.d||!B.ad.trim()||B.d<new Date().toISOString().slice(0,10)):0;
if(bad)return toast(m[st-1]);if(st<6){B.step++;return render()}
if(need())return;const[,,t]=cost(),code="PF"+Math.random().toString(36).slice(2,7).toUpperCase();
S.orders.unshift({code,k:"sv",ti:sv(B.sv).n+" · bé "+B.n,cg:cg(B.cg).n,tot:t,s:0,by:S.me.email,w:B.d+" "+B.t+" · "+B.ad,lg:["📝 Đã tạo đơn, chờ caregiver xác nhận"]});save();B.done=code;render()}
function shopPg(){const q=(F.q||"").toLowerCase(),m=+F.m||0,L=PR.filter(p=>(!F.c||p.c==F.c)&&p.n.toLowerCase().includes(q)&&(!m||p.p<=m));return`<div class="w"><h2>PAWFECT Shop</h2><p class="mu">Đối tác lưu kho và giao hàng; PAWFECT giới thiệu sản phẩm và nhận hoa hồng.</p><div class="fl"><input placeholder="Tìm sản phẩm…" value="${E(F.q||"")}" onchange="setF('q',this.value)">${sel("c",[["","Mọi danh mục"],...PC.map(c=>[c,c])])}${sel("m",[["","Mọi mức giá"],[50000,"Đến 50.000đ"],[150000,"Đến 150.000đ"],[300000,"Đến 300.000đ"]])}</div><div class="grid">${L.map(prCard).join("")||"<p>Không có sản phẩm phù hợp.</p>"}</div></div>`}
function cartPg(){const it=Object.keys(S.cart).map(i=>[pr(i),S.cart[i]]),t=it.reduce((a,[p,q])=>a+p.p*q,0);return`<div class="w"><h2>🛒 Giỏ hàng</h2>${it.length?it.map(([p,q])=>`<div class="card row" style="margin:8px 0"><span class="em">${p.e}</span><div class="g1"><b>${p.n}</b><br>${f(p.p)}</div><button class="btn o s" onclick="qt(${p.id},-1)">−</button><b>${q}</b><button class="btn o s" onclick="qt(${p.id},1)">+</button></div>`).join("")+`<div class="card"><h3>Tổng: ${f(t)}</h3><label>Họ tên</label><input value="${E(C.n)}" oninput="C.n=this.value"><label>Số điện thoại</label><input value="${E(C.ph)}" oninput="C.ph=this.value"><label>Địa chỉ giao hàng</label><input value="${E(C.ad)}" oninput="C.ad=this.value"><button class="btn" onclick="co()">Đặt hàng</button></div>`:'<p>Giỏ hàng trống. <a href="#shop"><b>Đến cửa hàng</b></a></p>'}</div>`}
function co(){if(!C.n.trim()||!C.ph.trim()||!C.ad.trim())return toast("Vui lòng điền đủ thông tin giao hàng");if(need())return;const it=Object.keys(S.cart).map(i=>[pr(i),S.cart[i]]);S.orders.unshift({code:"PF"+Math.random().toString(36).slice(2,7).toUpperCase(),k:"shop",ti:it.map(([p,q])=>p.n+" x"+q).join(", "),tot:it.reduce((a,[p,q])=>a+p.p*q,0),s:0,by:S.me.email,w:C.ad,lg:["🛍️ Đã nhận đơn hàng, chờ xác nhận"]});S.cart={};save();toast("Đặt hàng thành công!");go("orders")}
const gate=()=>`<div class="w"><div class="card"><h2>Bạn chưa đăng nhập</h2><p class="mu">Đăng nhập (demo) để xem đơn hàng.</p><a class="btn" href="#login">Đăng nhập</a></div></div>`;
function ordPg(){if(!S.me)return gate();const L=S.orders.filter(o=>o.by==S.me.email);return`<div class="w"><h2>Đơn hàng của tôi</h2>${L.length?L.map(o=>`<div class="card" style="margin:10px 0"><div class="row"><b>#${o.code}</b><span class="badge">${lb(o)}</span><b class="r">${f(o.tot)}</b></div><p>${E(o.ti)}</p><p class="mu">${o.w?"🗓 "+E(o.w):""}${o.cg?" · 👤 "+o.cg:""}</p><div class="dots">${ST.slice(0,4).map((l,i)=>`<span class="${o.s<4&&i<=o.s?"on":""}">${i==2&&o.k=="shop"?"Đang giao":l}</span>`).join("")}</div><ul>${o.lg.map(x=>`<li>${x}</li>`).join("")}</ul><div class="row">${o.s<3?`<button class="btn s" onclick="adv('${o.code}')">Mô phỏng cập nhật</button>`:""}${o.s<2?`<button class="btn o s" onclick="cx('${o.code}')">Hủy đơn</button>`:""}<button class="btn o s" onclick="toast('Đã gửi yêu cầu hỗ trợ cho #${o.code}')">Hỗ trợ</button></div>${o.s==3&&o.k=="sv"?rv(o):""}</div>`).join(""):'<p>Chưa có đơn nào. <a href="#booking"><b>Đặt dịch vụ</b></a></p>'}</div>`}
function rv(o){const r=S.rev.find(x=>x.o==o.code);return r?`<p>${"⭐".repeat(r.st)} ${E(r.tx)}</p>`:`<div class="fl"><select id="rs-${o.code}">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} sao</option>`).join("")}</select><input id="rt-${o.code}" placeholder="Nhận xét của bạn"><button class="btn s" onclick="sr('${o.code}')">Gửi đánh giá</button></div>`}
function sr(c){const o=S.orders.find(x=>x.code==c),tx=$("#rt-"+c).value.trim();if(!tx)return toast("Hãy nhập nhận xét");S.rev.push({o:c,cg:o.cg,st:+$("#rs-"+c).value,tx,by:S.me.name});save();toast("Cảm ơn đánh giá của bạn!");render()}
function adv(c){const o=S.orders.find(x=>x.code==c);o.s++;o.lg.push(["","✅ Đã xác nhận lịch","📸 Ảnh/video: bé đang được chăm sóc rất ngoan","🎉 Hoàn thành, nhật ký chăm sóc đã được cập nhật"][o.s]);save();render()}
function cx(c){const o=S.orders.find(x=>x.code==c);o.s=4;o.lg.push("❌ Đơn đã hủy");save();render()}
function aboutPg(){return`<div class="w"><h2>Giới thiệu PAWFECT</h2><p class="mu">PAWFECT ra đời với mong muốn giúp việc chăm sóc thú cưng trở nên thuận tiện, an toàn và đáng tin cậy hơn. Chúng tôi kết nối những người yêu động vật với đội ngũ chăm sóc phù hợp, đồng thời cung cấp các sản phẩm cần thiết để thú cưng luôn được yêu thương.</p><div class="grid">${[["🤝","Trust – Niềm tin"],["💚","Care – Sự tận tâm"],["🛡️","Safety – An toàn"],["⏱️","Convenience – Tiện lợi"],["🐾","Love – Yêu thương"]].map(([e,t])=>`<div class="card row"><div class="em">${e}</div><b>${t}</b></div>`).join("")}</div></div>`}
function ctPg(){return`<div class="w"><h2>Liên hệ</h2><div class="card" style="max-width:520px"><label>Họ tên</label><input id="cn"><label>Email</label><input id="ce" type="email"><label>Số điện thoại</label><input id="cp"><label>Nội dung cần hỗ trợ</label><textarea id="cm" rows="4"></textarea><button class="btn" onclick="sm()">Gửi thông tin</button><p class="mu">✉️ hello@pawfect.vn</p></div></div>`}
function sm(){const n=$("#cn").value.trim(),e=$("#ce").value.trim(),m=$("#cm").value.trim();if(!n||!e||!m)return toast("Vui lòng điền họ tên, email và nội dung");S.msg.unshift({n,e,p:$("#cp").value,m});save();toast("Đã gửi! PAWFECT sẽ liên hệ sớm.");render()}
const loginPg=()=>`<div class="w"><div class="card" style="max-width:420px;margin:auto"><h2>Đăng nhập / Đăng ký</h2><p class="mu">Tài khoản demo, lưu trên trình duyệt của bạn.</p><input id="ln" placeholder="Họ tên"><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Mật khẩu (demo)"><label><input type="checkbox" id="la" style="width:auto;margin-right:6px">Quản trị viên (demo)</label><br><br><button class="btn" onclick="li()">Tiếp tục</button></div></div>`;
function li(){const n=$("#ln").value.trim(),e=$("#le").value.trim().toLowerCase();if(!n||!e.includes("@"))return toast("Nhập họ tên và email hợp lệ");if(!S.users.find(u=>u.email==e))S.users.push({name:n,email:e});S.me={name:n,email:e,admin:$("#la").checked};save();toast("Xin chào "+n+"!");go(S.me.admin?"admin":"home")}
function ost(c,v){const o=S.orders.find(x=>x.code==c);o.s=+v;o.lg.push("🔧 Quản trị cập nhật: "+ST[v]);save();render()}
function vf(i){S.ver[i]=ok(cg(i))?0:1;save();render()}
function adm(){if(!S.me||!S.me.admin)return`<div class="w"><div class="card"><h2>Khu vực quản trị</h2><p class="mu">Đăng nhập và chọn “Quản trị viên (demo)”.</p><a class="btn" href="#login">Đăng nhập</a></div></div>`;const A=S.orders.filter(o=>o.s<4),st=(l,v)=>`<div class="card"><span class="mu">${l}</span><h3>${v}</h3></div>`;
return`<div class="w"><h2>📊 Dashboard quản trị</h2><div class="grid">${st("Khách hàng",S.users.length)}${st("Caregiver",CG.length)}${st("Đơn hàng",S.orders.length)}${st("Doanh thu",f(A.reduce((a,o)=>a+o.tot,0)))}${st("Hoa hồng ước tính",f(A.reduce((a,o)=>a+o.tot*(o.k=="shop"?.1:.15),0)))}${st("Sản phẩm",PR.length)}</div>
<h3>Xác minh caregiver (eKYC mô phỏng)</h3><div class="ov"><table>${CG.map(c=>`<tr><td>${c.n}</td><td>${c.a}</td><td>${ok(c)?"✅ Đã xác minh":"⏳ Chờ"}</td><td><button class="btn s o" onclick="vf(${c.id})">${ok(c)?"Thu hồi":"Duyệt"}</button></td></tr>`).join("")}</table></div>
<h3>Đơn hàng và lịch đặt</h3><div class="ov"><table>${S.orders.map(o=>`<tr><td>#${o.code}</td><td>${o.k=="shop"?"Cửa hàng":"Dịch vụ"}</td><td>${f(o.tot)}</td><td><select onchange="ost('${o.code}',this.value)" style="margin:0">${ST.map((l,i)=>`<option value="${i}"${o.s==i?" selected":""}>${l}</option>`).join("")}</select></td></tr>`).join("")||"<tr><td>Chưa có đơn</td></tr>"}</table></div>
<h3>Khách hàng</h3><p>${S.users.map(u=>E(u.name)+" ("+E(u.email)+")").join(" · ")||"Chưa có"}</p>
<h3>Đánh giá và phản hồi</h3>${S.rev.map(r=>`<div class="card" style="margin:6px 0">${"⭐".repeat(r.st)} ${E(r.tx)} <span class="mu">– ${E(r.by)} về ${r.cg}</span></div>`).join("")}${S.msg.map(m=>`<div class="card" style="margin:6px 0">✉️ <b>${E(m.n)}</b> (${E(m.e)}): ${E(m.m)}</div>`).join("")}</div>`}
const P={home,services:svPg,caregivers:cgPg,booking:bkPg,shop:shopPg,cart:cartPg,orders:ordPg,about:aboutPg,contact:ctPg,admin:adm,login:loginPg};
function render(){const h=location.hash.slice(1)||"home",m=h.match(/^cg-(\d+)$/);$("#h").innerHTML=hdr();$("#app").innerHTML=m?prof(+m[1]):(P[h]||home)()}
addEventListener("hashchange",()=>{F={};render();scrollTo(0,0)});render();
</script></body></html>
